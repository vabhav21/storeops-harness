spring.application.name=storeops-api
server.port=8080

# H2 in-memory database (per Section 3.2 stack choice)
spring.datasource.url=jdbc:h2:mem:storeops;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console for local inspection during the demonstration run
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
